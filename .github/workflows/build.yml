name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      # Surface compiler/Gradle errors as annotations so they're readable without the raw log.
      - name: Report build errors
        if: failure() && hashFiles('build.log') != ''
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log \
            | grep -v "^> Task" | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::$msg"

      - name: Check signing secret
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing secret::Add the KEYSTORE_PASSWORD secret (Settings → Secrets and variables → Actions) so builds can update each other."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Bladeboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Newest main build is always at Releases → "Latest build" as a plain .apk.
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bladeboard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Bladeboard.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Download Bladeboard.apk below and open it to install."
